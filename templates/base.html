<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="TaskFlow - sistema web acessível para gerenciamento de tarefas.">
  <title>{% block title %}TaskFlow{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body>
  <a class="pular" href="#conteudo">Pular para o conteúdo</a>
  <main id="conteudo" class="container" tabindex="-1">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <section class="mensagens" aria-label="Mensagens do sistema" aria-live="polite">
          {% for category, message in messages %}
            <p class="mensagem {{ category }}" role="status">{{ message }}</p>
          {% endfor %}
        </section>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
